name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @nexusdesk/types build
          pnpm --filter @nexusdesk/config build
          pnpm --filter @nexusdesk/crypto build
          pnpm --filter @nexusdesk/protocol build
          pnpm --filter @nexusdesk/validation build
          pnpm --filter @nexusdesk/desktop build

      - name: Build Tauri Windows Executable (.exe / .msi)
        run: |
          cd apps/desktop
          pnpm tauri build

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusdesk-windows-x64-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
