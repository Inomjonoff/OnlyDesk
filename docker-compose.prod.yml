version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusdesk-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexusdesk_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_prod} -d ${POSTGRES_DB:-nexusdesk_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusdesk-prod-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: nexusdesk-prod-coturn
    restart: always
    volumes:
      - ./infra/turn/coturn.prod.conf:/etc/coturn/turnserver.conf:ro
    network_mode: host

  minio:
    image: minio/minio:latest
    container_name: nexusdesk-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_prod_data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: nexusdesk-prod-api
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  signaling:
    build:
      context: .
      dockerfile: services/signaling/Dockerfile
    container_name: nexusdesk-prod-signaling
    restart: always
    environment:
      NODE_ENV: production
      SIGNALING_PORT: 4001
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4001:4001"
    depends_on:
      redis:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: nexusdesk-prod-ai
    restart: always
    environment:
      NODE_ENV: production
      AI_PORT: 4002
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "4002:4002"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: nexusdesk-prod-worker
    restart: always
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: nexusdesk-prod-prometheus
    restart: always
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "9090:9090"

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
  prometheus_prod_data:
