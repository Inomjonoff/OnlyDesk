version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusdesk-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus_demo
      POSTGRES_PASSWORD: demo_secure_postgres_pass_2026
      POSTGRES_DB: nexusdesk_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_demo -d nexusdesk_demo"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusdesk-demo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_demo_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: nexusdesk-demo-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    volumes:
      - ./infra/turn/coturn.prod.conf:/etc/coturn/turnserver.conf:ro

  minio:
    image: minio/minio:latest
    container_name: nexusdesk-demo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: demo_minio_user
      MINIO_ROOT_PASSWORD: demo_minio_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_demo_data:/data

volumes:
  postgres_demo_data:
  redis_demo_data:
  minio_demo_data:
