# Hardened Coturn STUN/TURN Production Configuration — NexusDesk AI
listening-port=3478
tls-listening-port=5349

# Authentication & Long-term credentials
use-auth-secret
static-auth-secret=nexusdesk-prod-turn-secret-change-in-env
realm=turn.nexusdesk.uz

# Relay Ports
min-port=49152
max-port=49200

# Security & Anti-Abuse
no-tcp-relay
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Quotas & Bandwidth Caps (2.5 Mbps per session max)
bps-capacity=50000000
total-quota=100
max-bps=312500

# Logging & Monitoring
verbose
fingerprint
stale-nonce=600
log-file=stdout
