global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "nexusdesk-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:4000", "host.docker.internal:4000"]

  - job_name: "nexusdesk-signaling"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["signaling:4001", "host.docker.internal:4001"]

  - job_name: "nexusdesk-ai"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai:4002", "host.docker.internal:4002"]

  - job_name: "nexusdesk-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:4003", "host.docker.internal:4003"]
